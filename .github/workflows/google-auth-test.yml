name: Test Google Authentication

on:
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: 'projects/218114534545/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions'
          service_account: 'etl-psicologia@software-etl.iam.gserviceaccount.com'

      - name: Test authentication
        run: |
          echo "Autenticação com Google Cloud realizada!"
